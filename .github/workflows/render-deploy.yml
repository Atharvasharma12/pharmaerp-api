name: Deploy Development

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Development to Render
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_DEVELOPMENT }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "❌ Development Render deploy hook is not configured"
            exit 1
          fi

          echo "🚀 Triggering Development deployment..."

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK"

          echo ""
          echo "✅ Development deployment triggered successfully"
