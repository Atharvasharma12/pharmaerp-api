name: Deploy PharmaERP to Render

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to deploy"
        required: true
        type: choice
        options:
          - development
          - uat
          - production

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }} to Render
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        env:
          DEVELOPMENT_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_DEVELOPMENT }}
          UAT_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_UAT }}
          PRODUCTION_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}
        run: |
          set -e

          case "${{ inputs.environment }}" in
            development)
              HOOK="$DEVELOPMENT_HOOK"
              ;;

            uat)
              HOOK="$UAT_HOOK"
              ;;

            production)
              HOOK="$PRODUCTION_HOOK"
              ;;

            *)
              echo "❌ Invalid environment"
              exit 1
              ;;
          esac

          if [ -z "$HOOK" ]; then
            echo "❌ Render deploy hook is not configured"
            exit 1
          fi

          echo "🚀 Deploying ${{ inputs.environment }}..."

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            "$HOOK"

          echo ""
          echo "✅ ${{ inputs.environment }} deployment triggered successfully"
