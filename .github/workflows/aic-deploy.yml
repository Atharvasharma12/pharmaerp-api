- name: Deploy to AIC Server
  uses: appleboy/ssh-action@v1.2.0
  with:
    host: ${{ secrets.SERVER_HOST }}
    username: ${{ secrets.SERVER_USERNAME }}
    password: ${{ secrets.SERVER_PASSWORD }}
    port: ${{ secrets.SERVER_PORT }}

    script: |
      set -e

      echo "======================================"
      echo "🚀 Starting Production Deployment"
      echo "======================================"

      cd /var/www/pharmaerp-api

      OLD_COMMIT=$(git rev-parse HEAD)

      echo "Current commit: $OLD_COMMIT"

      echo "📥 Fetching latest main..."
      git fetch origin main

      NEW_COMMIT=$(git rev-parse origin/main)

      echo "Latest commit: $NEW_COMMIT"

      if [ "$OLD_COMMIT" = "$NEW_COMMIT" ]; then
        echo "✅ Server is already up to date."
        exit 0
      fi

      echo "🔄 Updating production server..."
      git reset --hard origin/main

      echo "🔍 Checking dependency changes..."

      if git diff --name-only "$OLD_COMMIT" "$NEW_COMMIT" | grep -qE '(^|/)(package.json|package-lock.json)$'; then
        echo "📦 Dependency changes detected."
        echo "📦 Running npm ci..."
        npm ci
        echo "✅ Dependencies updated."
      else
        echo "✅ No dependency changes detected."
        echo "⏭️ Skipping npm ci."
      fi

      echo "🔄 Restarting PM2..."
      pm2 restart pharmaerp-api-prod

      pm2 save

      echo "======================================"
      echo "✅ Production deployment completed"
      echo "======================================"

      pm2 status
